<section class="share-bar" aria-label="Share this page">
  <span class="share-label">Share this page</span>
  <div class="share-row">
    <button type="button" class="share-btn share-native" data-share-native hidden data-umami-event="share_page" data-umami-event-via="native">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share</button>
    <a class="share-btn" style="--c:#e60023" href="https://www.pinterest.com/pin/create/button/?url={{shareUrl}}&amp;media={{shareImg}}&amp;description={{shareText}}" target="_blank" rel="noopener" aria-label="Save to Pinterest" data-umami-event="share_page" data-umami-event-via="pinterest">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12.3 5.5c-3.6 0-5.5 2.5-5.5 4.7 0 1.3.5 2.4 1.5 2.8.2.1.3 0 .4-.2l.1-.6c.1-.2 0-.3-.1-.5-.3-.4-.5-.9-.5-1.5 0-2 1.5-3.8 3.9-3.8 2.1 0 3.3 1.3 3.3 3 0 2.3-1 4.2-2.5 4.2-.8 0-1.4-.7-1.2-1.5.2-1 .7-2.1.7-2.8 0-.6-.3-1.2-1-1.2-.8 0-1.5.9-1.5 2 0 .7.2 1.2.2 1.2l-1 4.2c-.3 1.2 0 2.8 0 2.9l.2.1c.1-.1 1.1-1.4 1.5-2.6l.6-2.2c.3.6 1.1 1.1 2 1.1 2.6 0 4.4-2.4 4.4-5.6 0-2.4-2-4.7-5.1-4.7z" fill="#fff"/></svg>Pinterest</a>
    <a class="share-btn" style="--c:#1877f2" href="https://www.facebook.com/sharer/sharer.php?u={{shareUrl}}" target="_blank" rel="noopener" aria-label="Share on Facebook" data-umami-event="share_page" data-umami-event-via="facebook">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M13.2 21.9v-7h2.3l.4-2.8h-2.7v-1.8c0-.8.3-1.3 1.4-1.3H16V6.5c-.3 0-1.1-.1-2-.1-2 0-3.4 1.2-3.4 3.5v2.2H8.4v2.8h2.3v7c.8.1 1.7.1 2.5 0z" fill="#fff"/></svg>Facebook</a>
    <a class="share-btn" style="--c:#25d366" href="https://wa.me/?text={{shareText}}%20{{shareUrl}}" target="_blank" rel="noopener" aria-label="Share on WhatsApp" data-umami-event="share_page" data-umami-event-via="whatsapp">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.3 21.8l4.9-1.3A9.8 9.8 0 1 0 12 2.2z" fill="currentColor"/><path d="M16.9 14.6c-.3-.1-1.6-.8-1.8-.9-.3-.1-.4-.1-.6.1l-.8 1c-.2.2-.3.2-.6.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z" fill="#fff"/></svg>WhatsApp</a>
    <button type="button" class="share-btn" data-copy-link data-umami-event="share_page" data-umami-event-via="copy">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span>Copy link</span></button>
  </div>
</section>
