<header class="sticky top-0 z-50 bg-black/95 border-b border-zinc-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
    <a href="/" class="flex items-center gap-3 min-w-0">
      <img src="/favicon.svg" alt="" width="32" height="32" class="w-8 h-8 rounded-md shrink-0">
      <span class="min-w-0"><span class="block font-bold text-xs tracking-widest uppercase text-white leading-none">{{siteName}}</span>
      <span class="block text-[10px] text-zinc-400 mt-0.5 truncate">{{tagline}}</span></span>
    </a>

    <!-- Desktop menu -->
    <nav aria-label="Generators" class="hidden md:flex gap-x-5 whitespace-nowrap text-[11px] font-bold uppercase tracking-widest text-zinc-300">
      <a class="hover:text-white" href="/generators/baby-stats/">Baby Stats</a>
      <a class="hover:text-white" href="/generators/milestones/">Milestones</a>
      <a class="hover:text-white" href="/generators/flashcards/">Flashcards</a>
      <a class="hover:text-white" href="/generators/shower-games/">Shower Games</a>
    </nav>

    <!-- Phone menu: icon button that opens a dropdown (works without JavaScript) -->
    <details id="nav-menu" class="group md:hidden relative shrink-0">
      <summary aria-label="Menu" class="list-none [&::-webkit-details-marker]:hidden cursor-pointer select-none w-11 h-11 flex items-center justify-center rounded-md border border-zinc-800 text-zinc-200 hover:text-white hover:bg-zinc-900 group-open:bg-zinc-900">
        <svg class="group-open:hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="hidden group-open:block" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </summary>
      <nav aria-label="Menu" class="absolute right-0 mt-2 w-64 rounded-lg border border-zinc-800 bg-zinc-950 shadow-2xl p-1.5 text-sm font-semibold text-zinc-200">
        <a href="/" class="flex items-center gap-3 px-3 py-3 rounded-md hover:bg-zinc-900 hover:text-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
        <a href="/generators/baby-stats/" class="flex items-center gap-3 px-3 py-3 rounded-md hover:bg-zinc-900 hover:text-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M15 9h3M15 13h3M6 17c.6-1.5 1.8-2 3-2s2.4.5 3 2"/></svg>Baby Stats</a>
        <a href="/generators/milestones/" class="flex items-center gap-3 px-3 py-3 rounded-md hover:bg-zinc-900 hover:text-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Milestones</a>
        <a href="/generators/flashcards/" class="flex items-center gap-3 px-3 py-3 rounded-md hover:bg-zinc-900 hover:text-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Flashcards</a>
        <a href="/generators/shower-games/" class="flex items-center gap-3 px-3 py-3 rounded-md hover:bg-zinc-900 hover:text-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>Shower Games</a>
      </nav>
    </details>
  </div>
</header>
