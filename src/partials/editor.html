<section id="editor" class="border-b border-zinc-800" aria-label="{{h1}}">
  <div id="editor-bar" class="max-lg:sticky max-lg:top-0 max-lg:z-40 flex flex-wrap items-center justify-between gap-3 px-4 sm:px-6 py-3 bg-black border-b border-zinc-800">
    <div class="min-w-0 max-sm:contents">
      <h1 class="max-sm:sr-only font-bold text-sm tracking-widest uppercase text-white leading-tight">{{h1}}</h1>
      <p class="hidden sm:block text-[11px] text-zinc-400 mt-0.5">{{lead}}</p>
    </div>
    <div class="flex items-center justify-between sm:justify-start gap-1 w-full sm:w-auto sm:ml-auto">
      <div class="flex items-center gap-1">
        <button id="btn-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled class="btn -ml-2.5 sm:ml-0 !px-2.5 !py-2 text-zinc-300 hover:text-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button id="btn-redo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled class="btn !px-2.5 !py-2 text-zinc-300 hover:text-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <button id="btn-reset" type="button" class="btn text-zinc-400 hover:text-white whitespace-nowrap">Start over</button>
      </div>
      <button id="btn-download" type="button" class="btn sm:ml-3 !py-2.5 sm:!py-2 bg-indigo-600 hover:bg-indigo-500 text-white whitespace-nowrap inline-flex items-center gap-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>Download</button>
    </div>
  </div>
  {{ad leaderboard}}
  <div class="flex flex-col lg:flex-row lg:h-[calc(100vh-132px)] lg:min-h-[680px]">
    <aside id="controls" class="order-2 lg:order-1 w-full lg:w-[420px] xl:w-[460px] shrink-0 bg-[#09090b] border-r border-zinc-800 lg:overflow-y-auto scroll text-xs">
      <div id="controls-inner" class="p-5 space-y-6"><noscript>This generator needs JavaScript.</noscript></div>
    </aside>
    <div class="order-1 lg:order-2 flex-1 min-w-0 flex flex-col">
      <div id="pager" class="hidden items-center justify-center gap-3 bg-black border-b border-zinc-800 py-2 text-xs text-zinc-300">
        <button id="pager-prev" type="button" aria-label="Previous page" class="btn !py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white">&#9664;</button>
        <span id="pager-label" class="font-mono">Page 1 of 1</span>
        <button id="pager-next" type="button" aria-label="Next page" class="btn !py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white">&#9654;</button>
      </div>
      <div id="stage" class="flex-1 min-h-[300px] preview-stage p-4 flex items-center justify-center overflow-auto">
        <div id="sizer" class="shrink-0">
          <div id="card-scale" style="transform-origin: top left;">
            <div id="card-target" class="relative overflow-hidden shadow-2xl select-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <dialog id="dl-dialog" class="rounded-xl border border-zinc-700 bg-zinc-950 text-zinc-200 p-0 w-[calc(100%-2rem)] max-w-md backdrop:bg-black/70">
    <div class="p-5 space-y-3">
      <h2 class="text-sm font-bold uppercase tracking-widest text-white">Download your card</h2>
      <button type="button" data-dl="standard" class="w-full text-left rounded-lg border border-zinc-700 hover:border-indigo-400 hover:bg-zinc-900 p-4">
        <span class="block font-bold text-white">Print at home <span class="font-normal text-zinc-400">(PDF)</span></span>
        <span class="block text-xs text-zinc-400 mt-1">A document ready for your own printer. Small file.</span>
      </button>
      <button type="button" data-dl="print" class="w-full text-left rounded-lg border border-indigo-500 bg-indigo-950/40 hover:bg-indigo-950/70 p-4">
        <span class="block font-bold text-white">Print shop quality <span class="font-normal text-zinc-400">(PDF)</span></span>
        <span class="block text-xs text-zinc-400 mt-1">Highest quality with a 3 mm cutting margin (bleed). Larger file. Send it to a print shop or photo lab.</span>
      </button>
      <button type="button" data-dl="png" class="w-full text-left rounded-lg border border-zinc-700 hover:border-indigo-400 hover:bg-zinc-900 p-4">
        <span class="block font-bold text-white">Picture to share <span class="font-normal text-zinc-400">(PNG)</span></span>
        <span class="block text-xs text-zinc-400 mt-1">An image for WhatsApp, messages or social media.</span>
      </button>
      <button type="button" data-dl-cancel class="w-full text-center text-xs text-zinc-400 hover:text-white py-2">Cancel</button>
    </div>
  </dialog>
  <div id="mini-preview" class="hidden" data-html2canvas-ignore="true">
    <button id="mini-open" type="button" aria-label="Show the card bigger"><div id="mini-inner"></div></button>
    <button id="mini-close" type="button" aria-label="Hide the small preview">&#10005;</button>
  </div>
  <dialog id="big-preview" aria-label="Card preview" data-html2canvas-ignore="true">
    <button id="big-close" type="button" aria-label="Close the preview">&#10005;</button>
    <div id="big-sizer"><div id="big-inner"></div></div>
    <p id="big-note"></p>
  </dialog>
</section>
