<section id="editor" class="border-b border-zinc-800" aria-label="{{h1}}">
  <div class="flex flex-wrap items-center justify-between gap-3 px-4 sm:px-6 py-3 bg-black border-b border-zinc-800">
    <div class="min-w-0">
      <h1 class="font-bold text-sm tracking-widest uppercase text-white leading-tight">{{h1}}</h1>
      <p class="hidden sm:block text-[11px] text-zinc-400 mt-0.5">{{lead}}</p>
    </div>
    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto sm:flex-nowrap">
      <div class="flex items-center gap-2">
        <button id="btn-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled class="btn !px-2.5 !py-2 text-zinc-300 hover:text-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button id="btn-redo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled class="btn !px-2.5 !py-2 text-zinc-300 hover:text-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <button id="btn-reset" type="button" class="btn text-zinc-400 hover:text-white">Reset</button>
      </div>
      <div class="flex gap-3 w-full sm:w-auto sm:ml-1">
        <button id="btn-png" type="button" class="btn flex-1 sm:flex-none !py-2.5 sm:!py-2 bg-zinc-800 hover:bg-zinc-700 text-white whitespace-nowrap">Download PNG</button>
        <button id="btn-pdf" type="button" class="btn flex-1 sm:flex-none !py-2.5 sm:!py-2 bg-indigo-600 hover:bg-indigo-500 text-white whitespace-nowrap">Download PDF</button>
      </div>
    </div>
  </div>
  {{ad leaderboard}}
  <div class="flex flex-col lg:flex-row lg:h-[calc(100vh-132px)] lg:min-h-[680px]">
    <aside id="controls" class="order-2 lg:order-1 w-full lg:w-[420px] xl:w-[460px] shrink-0 bg-[#09090b] border-r border-zinc-800 lg:overflow-y-auto scroll text-xs">
      <div id="controls-inner" class="p-5 space-y-6"><noscript>This generator needs JavaScript.</noscript></div>
    </aside>
    <div class="order-1 lg:order-2 flex-1 min-w-0 flex flex-col">
      <div id="pager" class="hidden items-center justify-center gap-3 bg-black border-b border-zinc-800 py-2 text-xs text-zinc-300">
        <button id="pager-prev" type="button" class="btn !py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white">&#9664;</button>
        <span id="pager-label" class="font-mono">Page 1 of 1</span>
        <button id="pager-next" type="button" class="btn !py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white">&#9654;</button>
      </div>
      <div id="stage" class="flex-1 min-h-[300px] preview-stage p-4 flex items-center justify-center overflow-auto">
        <div id="sizer" class="shrink-0">
          <div id="card-scale" style="transform-origin: top left;">
            <div id="card-target" class="relative overflow-hidden shadow-2xl select-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
