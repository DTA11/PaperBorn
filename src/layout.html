<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{fullTitle}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{robotsMeta}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{fullTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#4f46e5">
<!-- Tailwind Play CDN: fine while developing. Before heavy traffic/ads, compile Tailwind (see README). -->
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  @layer components {
    .lbl  { @apply block text-zinc-400 mb-1 font-medium; }
    .inp  { @apply w-full bg-black border border-zinc-700 rounded p-1.5 text-white text-xs; }
    .box  { @apply space-y-2 bg-zinc-900 p-3 rounded-md border border-zinc-800; }
    .chk  { @apply flex items-center gap-2 text-zinc-300; }
    .sec  { @apply space-y-3 pb-5 border-b border-zinc-800; }
    .h2   { @apply font-black uppercase tracking-widest text-indigo-400 text-[11px]; }
    .btn  { @apply text-xs font-bold uppercase tracking-widest px-4 py-2.5 rounded-md transition disabled:opacity-50; }
  }
</style>
<link rel="stylesheet" href="/assets/css/site.css">
{{fonts}}
{{editorLibs}}
{{analytics}}
{{adsScript}}
</head>
<body class="bg-[#09090b] text-gray-100 antialiased min-h-screen flex flex-col">
{{> header}}
<main class="flex-1">
{{content}}
</main>
{{> footer}}
{{moduleScript}}
</body>
</html>
