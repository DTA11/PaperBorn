<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Stats Studio - Multi-Aesthetic Card Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        studio: {
                            50: '#f8f8f8',
                            100: '#f0f0f0',
                            800: '#18181b',
                            900: '#09090b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                        playful: ['Fredoka', 'Quicksand', 'sans-serif'],
                        handwritten: ['Caveat', 'cursive'],
                        vintage: ['Cinzel Decorative', 'Cinzel', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for Diverse Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Fredoka:wght@400;600;700&family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Print Rules */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-area-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                background: white !important;
                box-shadow: none !important;
            }
            .card-page {
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
                width: 100% !important;
                height: 100vh !important;
                page-break-after: always;
            }
        }

        /* Dark Stage Background for Editor Workspace */
        .preview-stage {
            background-color: #0d0d11;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 24px 24px, 48px 48px, 48px 48px;
        }

        /* Dimension Standard Definitions */
        .dim-a4 { width: 210mm; height: 297mm; }
        .dim-a5 { width: 148mm; height: 210mm; }
        .dim-usletter { width: 8.5in; height: 11in; }
        .dim-frame8x10 { width: 8in; height: 10in; }
        .dim-square { width: 210mm; height: 210mm; }

        /* Typography Mode Overrides */
        .font-mode-sans { font-family: 'Inter', sans-serif !important; }
        .font-mode-serif { font-family: 'Playfair Display', serif !important; }
        .font-mode-playful { font-family: 'Fredoka', sans-serif !important; }
        .font-mode-handwritten { font-family: 'Caveat', cursive !important; }
        .font-mode-vintage { font-family: 'Cinzel', serif !important; }
        .font-mode-mono { font-family: 'JetBrains Mono', monospace !important; }

        /* Gold Gradient Effect */
        .gold-metallic-text {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-metallic-bg {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
        }

        .gold-border {
            border-color: #d4af37 !important;
        }

        /* Cyber Glow Effect */
        .cyber-glow-text {
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0,255,204,0.6);
        }

        .cyber-border {
            border-color: #00ffcc !important;
            box-shadow: inset 0 0 10px rgba(0,255,204,0.2), 0 0 10px rgba(0,255,204,0.3);
        }

        /* Crop Marks Styling */
        .crop-mark {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 40;
        }
        .crop-tl { top: 10px; left: 10px; border-top: 1px solid currentColor; border-left: 1px solid currentColor; }
        .crop-tr { top: 10px; right: 10px; border-top: 1px solid currentColor; border-right: 1px solid currentColor; }
        .crop-bl { bottom: 10px; left: 10px; border-bottom: 1px solid currentColor; border-left: 1px solid currentColor; }
        .crop-br { bottom: 10px; right: 10px; border-bottom: 1px solid currentColor; border-right: 1px solid currentColor; }

        input[type="range"] {
            accent-color: #6366f1;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #121215;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="bg-studio-900 font-sans text-gray-100 antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="no-print bg-black border-b border-zinc-800 px-6 py-3.5 flex flex-wrap justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-indigo-600 text-white font-black flex items-center justify-center text-sm tracking-tighter rounded-md shadow-lg shadow-indigo-500/30">
                BSS
            </div>
            <div>
                <h1 class="font-bold text-xs tracking-widest uppercase text-white leading-none">Birth Stats Studio</h1>
                <p class="text-[10px] text-zinc-400 mt-0.5">Multi-Aesthetic Design &amp; Print System</p>
            </div>
        </div>

        <div class="flex items-center space-x-3 mt-2 sm:mt-0">
            <button onclick="resetDefaults()" class="text-xs text-zinc-400 hover:text-white px-3 py-1.5 rounded transition">
                Reset Sample
            </button>
            <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs uppercase tracking-widest px-5 py-2.5 rounded-md shadow-lg shadow-indigo-600/20 flex items-center space-x-2 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                </svg>
                <span>Export / Print PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Controls Studio Sidebar -->
        <aside class="no-print w-full lg:w-[460px] xl:w-[500px] bg-studio-900 border-r border-zinc-800 flex flex-col h-auto lg:h-[calc(100vh-57px)] custom-scrollbar overflow-y-auto text-xs">
            
            <div class="p-5 space-y-6">

                <!-- 1. Aesthetics & Style Presets -->
                <div class="space-y-3 pb-5 border-b border-zinc-800">
                    <div class="flex justify-between items-center">
                        <h2 class="font-black uppercase tracking-widest text-indigo-400 text-[11px]">1. Aesthetic Theme</h2>
                        <span class="text-[10px] text-zinc-500 font-mono">7 STYLES</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="setStyle('minimalist')" id="btn-minimalist" class="style-btn p-3 border rounded-md text-left transition border-indigo-500 bg-indigo-950/40 text-white font-bold">
                            <span class="block text-xs">1) Minimalist Gallery</span>
                            <span class="block text-[9px] text-zinc-400 mt-0.5">Monochrome &amp; clean geometry</span>
                        </button>
                        <button type="button" onclick="setStyle('playful')" id="btn-playful" class="style-btn p-3 border rounded-md text-left transition border-zinc-800 bg-zinc-900 text-zinc-300 hover:border-zinc-700">
                            <span class="block text-xs">2) Playful &amp; Whimsical</span>
                            <span class="block text-[9px] text-zinc-500 mt-0.5">Soft pastels &amp; storybook icons</span>
                        </button>
                        <button type="button" onclick="setStyle('vintage')" id="btn-vintage" class="style-btn p-3 border rounded-md text-left transition border-zinc-800 bg-zinc-900 text-zinc-300 hover:border-zinc-700">
                            <span class="block text-xs">3) Victorian Gazette</span>
                            <span class="block text-[9px] text-zinc-500 mt-0.5">Aged parchment &amp; news rules</span>
                        </button>
                        <button type="button" onclick="setStyle('luxury')" id="btn-luxury" class="style-btn p-3 border rounded-md text-left transition border-zinc-800 bg-zinc-900 text-zinc-300 hover:border-zinc-700">
                            <span class="block text-xs">4) Gold &amp; Midnight Noir</span>
                            <span class="block text-[9px] text-zinc-500 mt-0.5">Luxury charcoal &amp; metallic foil</span>
                        </button>
                        <button type="button" onclick="setStyle('boho')" id="btn-boho" class="style-btn p-3 border rounded-md text-left transition border-zinc-800 bg-zinc-900 text-zinc-300 hover:border-zinc-700">
                            <span class="block text-xs">5) Boho Botanical</span>
                            <span class="block text-[9px] text-zinc-500 mt-0.5">Terracotta, sage &amp; line art</span>
                        </button>
                        <button type="button" onclick="setStyle('cyber')" id="btn-cyber" class="style-btn p-3 border rounded-md text-left transition border-zinc-800 bg-zinc-900 text-zinc-300 hover:border-zinc-700">
                            <span class="block text-xs">6) Cyber Tech Sheet</span>
                            <span class="block text-[9px] text-zinc-500 mt-0.5">Neon accents &amp; HUD geometry</span>
                        </button>
                        <button type="button" onclick="setStyle('editorial')" id="btn-editorial" class="style-btn p-3 border rounded-md text-left transition border-zinc-800 bg-zinc-900 text-zinc-300 hover:border-zinc-700 col-span-2">
                            <span class="block text-xs">7) Editorial High Fashion</span>
                            <span class="block text-[9px] text-zinc-500 mt-0.5">Vogue headline layouts &amp; high-contrast serif framing</span>
                        </button>
                    </div>
                </div>

                <!-- 2. Photo Processing & Filter Engine -->
                <div class="space-y-4 pb-5 border-b border-zinc-800">
                    <div class="flex justify-between items-center">
                        <h2 class="font-black uppercase tracking-widest text-indigo-400 text-[11px]">2. Photo Studio &amp; Filters</h2>
                        <label class="flex items-center space-x-1.5 cursor-pointer text-zinc-300">
                            <input type="checkbox" id="tog-photo" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700 text-indigo-600">
                            <span class="text-[10px] uppercase tracking-wider font-bold">Include Photo</span>
                        </label>
                    </div>

                    <div id="photo-controls-group" class="space-y-3 bg-zinc-900 p-3 rounded-md border border-zinc-800">
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">Upload Image</label>
                            <input type="file" id="photo-file" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-zinc-300 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-white hover:file:bg-zinc-700 cursor-pointer">
                        </div>

                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <div>
                                <label class="block text-zinc-400 mb-1">Frame Shape</label>
                                <select id="photo-shape" onchange="renderCard()" class="w-full bg-black border border-zinc-700 rounded p-1.5 text-white">
                                    <option value="rectangle" selected>Rectangle</option>
                                    <option value="circle">Circle Vignette</option>
                                    <option value="oval">Oval Classic</option>
                                    <option value="arch">Architectural Arch</option>
                                    <option value="hexagon">Hexagon Tech</option>
                                    <option value="rounded">Soft Rounded</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-zinc-400 mb-1">Color Filter Mode</label>
                                <select id="photo-filterMode" onchange="renderCard()" class="w-full bg-black border border-zinc-700 rounded p-1.5 text-white">
                                    <option value="none">Full Natural Color</option>
                                    <option value="grayscale" selected>High Contrast B&amp;W</option>
                                    <option value="sepia">Soft Sepia Vintage</option>
                                    <option value="warm">Warm Sunlight</option>
                                    <option value="cool">Cool Midnight</option>
                                    <option value="dither">Vintage Dither</option>
                                </select>
                            </div>
                        </div>

                        <!-- Sliders -->
                        <div class="space-y-2 pt-2 border-t border-zinc-800">
                            <div>
                                <div class="flex justify-between text-[10px] text-zinc-400 mb-0.5">
                                    <span>Brightness</span>
                                    <span id="val-brightness">100%</span>
                                </div>
                                <input type="range" id="photo-brightness" min="50" max="150" value="100" oninput="updatePhotoSlider('brightness')" class="w-full">
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] text-zinc-400 mb-0.5">
                                    <span>Contrast</span>
                                    <span id="val-contrast">110%</span>
                                </div>
                                <input type="range" id="photo-contrast" min="50" max="200" value="110" oninput="updatePhotoSlider('contrast')" class="w-full">
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] text-zinc-400 mb-0.5">
                                    <span>Zoom / Scale</span>
                                    <span id="val-zoom">100%</span>
                                </div>
                                <input type="range" id="photo-zoom" min="80" max="200" value="100" oninput="updatePhotoSlider('zoom')" class="w-full">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <div class="flex justify-between text-[10px] text-zinc-400 mb-0.5">
                                        <span>Offset X</span>
                                        <span id="val-offsetX">0px</span>
                                    </div>
                                    <input type="range" id="photo-offsetX" min="-100" max="100" value="0" oninput="updatePhotoSlider('offsetX')" class="w-full">
                                </div>
                                <div>
                                    <div class="flex justify-between text-[10px] text-zinc-400 mb-0.5">
                                        <span>Offset Y</span>
                                        <span id="val-offsetY">0px</span>
                                    </div>
                                    <input type="range" id="photo-offsetY" min="-100" max="100" value="0" oninput="updatePhotoSlider('offsetY')" class="w-full">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. Typography & Canvas Sizes -->
                <div class="space-y-3 pb-5 border-b border-zinc-800">
                    <h2 class="font-black uppercase tracking-widest text-indigo-400 text-[11px]">3. Paper Format &amp; Typography</h2>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-zinc-400 mb-1">Canvas Size</label>
                            <select id="input-format" onchange="updateFormat()" class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-white">
                                <option value="a4" selected>A4 Poster (210×297 mm)</option>
                                <option value="a5">A5 Card (148×210 mm)</option>
                                <option value="usletter">US Letter (8.5×11 in)</option>
                                <option value="frame8x10">8×10 Frame (203×254 mm)</option>
                                <option value="square">Square Frame (210×210 mm)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1">Font Pair Preset</label>
                            <select id="input-font" onchange="updateFont()" class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-white">
                                <option value="serif" selected>Playfair Serif (Editorial)</option>
                                <option value="sans">Inter Modern (Architectural)</option>
                                <option value="playful">Fredoka (Playful)</option>
                                <option value="handwritten">Caveat (Script/Boho)</option>
                                <option value="vintage">Cinzel (Vintage Gazette)</option>
                                <option value="mono">JetBrains Mono (Tech Sheet)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 4. Metric Fields & Custom Text Data Entry -->
                <div class="space-y-4 pb-5 border-b border-zinc-800">
                    <h2 class="font-black uppercase tracking-widest text-indigo-400 text-[11px]">4. Metric Vitals &amp; Granular Toggles</h2>

                    <!-- Baby Name -->
                    <div class="space-y-2 bg-zinc-900 p-3 rounded-md border border-zinc-800">
                        <div class="flex justify-between items-center">
                            <label class="flex items-center space-x-2 text-white font-bold">
                                <input type="checkbox" id="tog-name" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Baby Name</span>
                            </label>
                            <label class="flex items-center space-x-1.5 text-zinc-400">
                                <input type="checkbox" id="tog-monogram" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Monogram</span>
                            </label>
                        </div>
                        <div class="grid grid-cols-3 gap-2 pt-1">
                            <input type="text" id="input-firstName" placeholder="First Name" oninput="renderCard()" class="col-span-2 bg-black border border-zinc-700 rounded p-1.5 text-white">
                            <input type="text" id="input-monogram" placeholder="AV" maxlength="3" oninput="renderCard()" class="bg-black border border-zinc-700 rounded p-1.5 text-white text-center uppercase font-bold">
                        </div>
                        <input type="text" id="input-lastName" placeholder="Last Name" oninput="renderCard()" class="w-full bg-black border border-zinc-700 rounded p-1.5 text-white">
                    </div>

                    <!-- Date & Time -->
                    <div class="space-y-2 bg-zinc-900 p-3 rounded-md border border-zinc-800">
                        <div class="flex justify-between items-center">
                            <label class="flex items-center space-x-2 text-white font-bold">
                                <input type="checkbox" id="tog-date" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Birth Date</span>
                            </label>
                            <label class="flex items-center space-x-1.5 text-zinc-400">
                                <input type="checkbox" id="tog-time" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Time</span>
                            </label>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <input type="text" id="input-date" placeholder="10 OCTOBER 2026" oninput="renderCard()" class="bg-black border border-zinc-700 rounded p-1.5 text-white">
                            <input type="text" id="input-time" placeholder="08:42 CEST" oninput="renderCard()" class="bg-black border border-zinc-700 rounded p-1.5 text-white">
                        </div>
                    </div>

                    <!-- Metric Stats -->
                    <div class="space-y-2 bg-zinc-900 p-3 rounded-md border border-zinc-800">
                        <div class="flex justify-between items-center">
                            <label class="flex items-center space-x-2 text-white font-bold">
                                <input type="checkbox" id="tog-weight" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Weight (Metric)</span>
                            </label>
                            <label class="flex items-center space-x-1.5 text-zinc-400">
                                <input type="checkbox" id="tog-height" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Height (Metric)</span>
                            </label>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <div>
                                <input type="text" id="input-weight" placeholder="3450 G" oninput="renderCard()" class="w-full bg-black border border-zinc-700 rounded p-1.5 text-white">
                                <input type="text" id="input-weightSub" placeholder="3.45 kg" oninput="renderCard()" class="w-full bg-black border border-zinc-800 rounded p-1 text-zinc-400 text-[10px] mt-1">
                            </div>
                            <div>
                                <input type="text" id="input-height" placeholder="51 CM" oninput="renderCard()" class="w-full bg-black border border-zinc-700 rounded p-1.5 text-white">
                                <input type="text" id="input-heightSub" placeholder="510 mm" oninput="renderCard()" class="w-full bg-black border border-zinc-800 rounded p-1 text-zinc-400 text-[10px] mt-1">
                            </div>
                        </div>
                    </div>

                    <!-- Hospital, City & Coordinates -->
                    <div class="space-y-2 bg-zinc-900 p-3 rounded-md border border-zinc-800">
                        <div class="flex justify-between items-center">
                            <label class="flex items-center space-x-2 text-white font-bold">
                                <input type="checkbox" id="tog-location" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Hospital &amp; City</span>
                            </label>
                            <label class="flex items-center space-x-1.5 text-zinc-400">
                                <input type="checkbox" id="tog-coords" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Coordinates</span>
                            </label>
                        </div>
                        <input type="text" id="input-location" placeholder="Medical Center Name" oninput="renderCard()" class="w-full bg-black border border-zinc-700 rounded p-1.5 text-white">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="input-city" placeholder="Ljubljana, Slovenia" oninput="renderCard()" class="bg-black border border-zinc-700 rounded p-1.5 text-white">
                            <input type="text" id="input-coords" placeholder="46.0569° N, 14.5058° E" oninput="renderCard()" class="bg-black border border-zinc-700 rounded p-1.5 text-white">
                        </div>
                    </div>

                    <!-- Parents, Zodiac & Custom Quote -->
                    <div class="space-y-2 bg-zinc-900 p-3 rounded-md border border-zinc-800">
                        <div class="flex justify-between items-center">
                            <label class="flex items-center space-x-2 text-white font-bold">
                                <input type="checkbox" id="tog-parents" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Parents</span>
                            </label>
                            <label class="flex items-center space-x-1.5 text-zinc-400">
                                <input type="checkbox" id="tog-zodiac" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                <span>Zodiac Sign</span>
                            </label>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <input type="text" id="input-parents" placeholder="EMMA & MARK" oninput="renderCard()" class="bg-black border border-zinc-700 rounded p-1.5 text-white">
                            <input type="text" id="input-zodiac" placeholder="LIBRA ♎" oninput="renderCard()" class="bg-black border border-zinc-700 rounded p-1.5 text-white">
                        </div>
                        <div class="pt-2 border-t border-zinc-800">
                            <div class="flex justify-between items-center mb-1">
                                <label class="flex items-center space-x-2 text-white font-bold">
                                    <input type="checkbox" id="tog-quote" onchange="renderCard()" checked class="rounded bg-zinc-800 border-zinc-700">
                                    <span>Custom Dedication / Quote</span>
                                </label>
                            </div>

    <!-- Application Script Logic -->
    <script>
        const sampleImageURL = 'https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=800&q=80';

        // Application State
        const state = {
            style: 'minimalist', // minimalist, playful, vintage, luxury, boho, cyber, editorial
            format: 'a4',
            fontMode: 'serif',
            
            photo: {
                src: sampleImageURL,
                shape: 'rectangle',      // rectangle, circle, oval, arch, hexagon, rounded
                filterMode: 'grayscale', // none, grayscale, sepia, warm, cool, dither
                brightness: 100,
                contrast: 110,
                zoom: 100,
                offsetX: 0,
                offsetY: 0,
            },

            toggles: {
                photo: true,
                name: true,
                monogram: true,
                date: true,
                time: true,
                weight: true,
                height: true,
                location: true,
                coords: true,
                parents: true,
                zodiac: true,
                quote: true,
                accents: true,
                border: true,
                crop: false,
                footer: true
            },

            data: {
                firstName: 'AURELIA',
                lastName: 'VALENTINE',
                monogram: 'AV',
                date: '10 OCTOBER 2026',
                time: '08:42 CEST',
                weight: '3450 G',
                weightSub: '3.45 kg',
                height: '51 CM',
                heightSub: '510 mm',
                location: 'Ljubljana Medical Center',
                city: 'Ljubljana, Slovenia',
                coords: '46.0569° N, 14.5058° E',
                parents: 'EMMA & MARK',
                zodiac: 'LIBRA ♎',
                quote: 'Little miracle, endless love.'
            }
        };

        function initForm() {
            document.getElementById('input-firstName').value = state.data.firstName;
            document.getElementById('input-lastName').value = state.data.lastName;
            document.getElementById('input-monogram').value = state.data.monogram;
            document.getElementById('input-date').value = state.data.date;
            document.getElementById('input-time').value = state.data.time;
            document.getElementById('input-weight').value = state.data.weight;
            document.getElementById('input-weightSub').value = state.data.weightSub;
            document.getElementById('input-height').value = state.data.height;
            document.getElementById('input-heightSub').value = state.data.heightSub;
            document.getElementById('input-location').value = state.data.location;
            document.getElementById('input-city').value = state.data.city;
            document.getElementById('input-coords').value = state.data.coords;
            document.getElementById('input-parents').value = state.data.parents;
            document.getElementById('input-zodiac').value = state.data.zodiac;
            document.getElementById('input-quote').value = state.data.quote;

            for (let key in state.toggles) {
                const el = document.getElementById(`tog-${key}`);
                if (el) el.checked = state.toggles[key];
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    state.photo.src = event.target.result;
                    renderCard();
                };
                reader.readAsDataURL(file);
            }
        }

        function updatePhotoSlider(key) {
            const val = document.getElementById(`photo-${key}`).value;
            state.photo[key] = parseInt(val);
            
            let unit = '%';
            if (key === 'offsetX' || key === 'offsetY') unit = 'px';
            document.getElementById(`val-${key}`).textContent = `${val}${unit}`;
            
            renderCard();
        }

        function readFormInputs() {
            state.data.firstName = document.getElementById('input-firstName').value || 'AURELIA';
            state.data.lastName = document.getElementById('input-lastName').value || 'VALENTINE';
            state.data.monogram = document.getElementById('input-monogram').value || 'AV';
            state.data.date = document.getElementById('input-date').value || '10 OCTOBER 2026';
            state.data.time = document.getElementById('input-time').value || '08:42 CEST';
            state.data.weight = document.getElementById('input-weight').value || '3450 G';
            state.data.weightSub = document.getElementById('input-weightSub').value || '3.45 kg';
            state.data.height = document.getElementById('input-height').value || '51 CM';
            state.data.heightSub = document.getElementById('input-heightSub').value || '510 mm';
            state.data.location = document.getElementById('input-location').value || 'Medical Center';
            state.data.city = document.getElementById('input-city').value || 'Ljubljana, Slovenia';
            state.data.coords = document.getElementById('input-coords').value || '46.0569° N, 14.5058° E';
            state.data.parents = document.getElementById('input-parents').value || 'EMMA & MARK';
            state.data.zodiac = document.getElementById('input-zodiac').value || 'LIBRA ♎';
            state.data.quote = document.getElementById('input-quote').value || 'Little miracle, endless love.';

            state.photo.shape = document.getElementById('photo-shape').value;
            state.photo.filterMode = document.getElementById('photo-filterMode').value;

            for (let key in state.toggles) {
                const el = document.getElementById(`tog-${key}`);
                if (el) state.toggles[key] = el.checked;
            }
        }

        function setStyle(styleName) {
            state.style = styleName;
            document.querySelectorAll('.style-btn').forEach(btn => {
                btn.classList.remove('border-indigo-500', 'bg-indigo-950/40', 'text-white', 'font-bold');
                btn.classList.add('border-zinc-800', 'bg-zinc-900', 'text-zinc-300');
            });
            const activeBtn = document.getElementById(`btn-${styleName}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-zinc-800', 'bg-zinc-900', 'text-zinc-300');
                activeBtn.classList.add('border-indigo-500', 'bg-indigo-950/40', 'text-white', 'font-bold');
            }

            // Sync font mode defaults per style
            const fontSelect = document.getElementById('input-font');
            if (styleName === 'playful') fontSelect.value = 'playful';
            else if (styleName === 'vintage') fontSelect.value = 'vintage';
            else if (styleName === 'boho') fontSelect.value = 'handwritten';
            else if (styleName === 'cyber') fontSelect.value = 'mono';
            else if (styleName === 'editorial' || styleName === 'luxury') fontSelect.value = 'serif';
            else fontSelect.value = 'sans';

            updateFont();
        }

        function updateFormat() {
            state.format = document.getElementById('input-format').value;
            const target = document.getElementById('card-target');
            target.classList.remove('dim-a4', 'dim-a5', 'dim-usletter', 'dim-frame8x10', 'dim-square');
            target.classList.add(`dim-${state.format}`);
            renderCard();
        }

        function updateFont() {
            state.fontMode = document.getElementById('input-font').value;
            const target = document.getElementById('card-target');
            target.classList.remove('font-mode-sans', 'font-mode-serif', 'font-mode-playful', 'font-mode-handwritten', 'font-mode-vintage', 'font-mode-mono');
            target.classList.add(`font-mode-${state.fontMode}`);
            renderCard();
        }

        function resetDefaults() {
            state.data = {
                firstName: 'AURELIA',
                lastName: 'VALENTINE',
                monogram: 'AV',
                date: '10 OCTOBER 2026',
                time: '08:42 CEST',
                weight: '3450 G',
                weightSub: '3.45 kg',
                height: '51 CM',
                heightSub: '510 mm',
                location: 'Ljubljana Medical Center',
                city: 'Ljubljana, Slovenia',
                coords: '46.0569° N, 14.5058° E',
                parents: 'EMMA & MARK',
                zodiac: 'LIBRA ♎',
                quote: 'Little miracle, endless love.'
            };
            state.photo.src = sampleImageURL;
            state.photo.brightness = 100;
            state.photo.contrast = 110;
            state.photo.zoom = 100;
            state.photo.offsetX = 0;
            state.photo.offsetY = 0;
            initForm();
            renderCard();
        }

        function generatePhotoHTML(additionalClasses = '') {
            if (!state.toggles.photo || !state.photo.src) return '';

            const p = state.photo;
            
            let shapeClass = 'rounded-none';
            if (p.shape === 'circle') shapeClass = 'rounded-full aspect-square';
            if (p.shape === 'oval') shapeClass = 'rounded-[50%] aspect-[3/4]';
            if (p.shape === 'arch') shapeClass = 'rounded-t-full aspect-[3/4]';
            if (p.shape === 'hexagon') shapeClass = '[clip-path:polygon(25%_0%,75%_0%,100%_50%,75%_100%,25%_100%,0%_50%)] aspect-square';
            if (p.shape === 'rounded') shapeClass = 'rounded-2xl aspect-[3/4]';

            let filterCss = `brightness(${p.brightness}%) contrast(${p.contrast}%)`;
            if (p.filterMode === 'grayscale') filterCss += ' grayscale(100%)';
            if (p.filterMode === 'sepia') filterCss += ' sepia(60%)';
            if (p.filterMode === 'warm') filterCss += ' sepia(20%) saturate(140%)';
            if (p.filterMode === 'cool') filterCss += ' hue-rotate(180deg) saturate(120%)';
            if (p.filterMode === 'dither') filterCss += ' grayscale(100%) contrast(250%)';

            const transformCss = `scale(${p.zoom / 100}) translate(${p.offsetX}px, ${p.offsetY}px)`;

            return `
                <div class="relative overflow-hidden ${shapeClass} ${additionalClasses}">
                    <img src="${p.src}" alt="Baby Portrait" class="w-full h-full object-cover transition-transform duration-75" style="filter: ${filterCss}; transform: ${transformCss};">
                </div>
            `;
        }

        function renderCropMarks() {
            if (!state.toggles.crop) return '';
            return `
                <div class="crop-mark crop-tl"></div>
                <div class="crop-mark crop-tr"></div>
                <div class="crop-mark crop-bl"></div>
                <div class="crop-mark crop-br"></div>
            `;
        }

        function renderCard() {
            readFormInputs();
            const d = state.data;
            const t = state.toggles;
            const container = document.getElementById('card-target');

            // Reset background and base colors
            container.style.backgroundColor = '';
            container.style.color = '';
            container.className = `card-page dim-${state.format} font-mode-${state.fontMode} p-8 flex flex-col justify-between shadow-2xl relative overflow-hidden select-none`;

            let html = '';
            switch(state.style) {
                case 'minimalist': html = renderMinimalistStyle(d, t); break;
                case 'playful': html = renderPlayfulStyle(d, t); break;
                case 'vintage': html = renderVintageStyle(d, t); break;
                case 'luxury': html = renderLuxuryStyle(d, t); break;
                case 'boho': html = renderBohoStyle(d, t); break;
                case 'cyber': html = renderCyberStyle(d, t); break;
                case 'editorial': html = renderEditorialStyle(d, t); break;
                default: html = renderMinimalistStyle(d, t);
            }

            container.innerHTML = renderCropMarks() + html;
        }

        // 1. Minimalist Gallery Style
        function renderMinimalistStyle(d, t) {
            return `
                <div class="h-full flex flex-col justify-between relative z-10 text-black">
                    <div class="flex justify-between items-start border-b border-black pb-4">
                        <div>
                            ${t.name ? `<h1 class="text-3xl sm:text-4xl font-normal uppercase tracking-tight leading-none">${d.firstName} <strong class="font-black block">${d.lastName}</strong></h1>` : ''}
                        </div>
                        <div class="text-right">
                            ${t.date ? `<div class="text-lg font-bold">${d.date}</div>` : ''}
                            ${t.time ? `<div class="text-xs uppercase tracking-widest text-neutral-500">${d.time}</div>` : ''}
                        </div>
                    </div>

                    <div class="my-auto py-6 grid grid-cols-12 gap-6 items-center">
                        <div class="col-span-7">
                            ${generatePhotoHTML('w-full max-h-[320px] border border-black shadow-sm')}
                        </div>
                        <div class="col-span-5 space-y-4 text-left border-l border-black pl-6">
                            ${t.weight ? `
                                <div>
                                    <span class="block text-[8pt] uppercase tracking-widest text-neutral-400 font-bold">MASS / WEIGHT</span>
                                    <span class="text-2xl font-bold uppercase">${d.weight}</span>
                                    <span class="block text-xs text-neutral-500">${d.weightSub}</span>
                                </div>
                            ` : ''}
                            ${t.height ? `
                                <div>
                                    <span class="block text-[8pt] uppercase tracking-widest text-neutral-400 font-bold">HEIGHT / LENGTH</span>
                                    <span class="text-2xl font-bold uppercase">${d.height}</span>
                                    <span class="block text-xs text-neutral-500">${d.heightSub}</span>
                                </div>
                            ` : ''}
                            ${t.zodiac ? `
                                <div>
                                    <span class="block text-[8pt] uppercase tracking-widest text-neutral-400 font-bold">ASTRONOMY</span>
                                    <span class="text-sm font-semibold uppercase">${d.zodiac}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <div class="border-t border-black pt-4 grid grid-cols-2 gap-4 text-xs">
                        <div>
                            ${t.location ? `<div class="font-bold uppercase">${d.location}</div>` : ''}
                            ${t.location ? `<div class="text-neutral-500">${d.city}</div>` : ''}
                        </div>
                        <div class="text-right">
                            ${t.parents ? `<div class="font-bold uppercase">PARENTS: ${d.parents}</div>` : ''}
                            ${t.quote ? `<div class="italic text-neutral-600 mt-0.5">"${d.quote}"</div>` : ''}
                        </div>
                    </div>

                    ${t.footer ? `
                        <div class="mt-4 pt-2 border-t border-neutral-200 flex justify-between text-[7pt] tracking-widest uppercase text-neutral-400 font-mono">
                            <span>GALLERY MINIMAL EDITION</span>
                            <span>${d.coords}</span>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 2. Playful & Whimsical Style
        function renderPlayfulStyle(d, t) {
            const container = document.getElementById('card-target');
            container.style.backgroundColor = '#fffdf7';
            
            return `
                <div class="h-full flex flex-col justify-between relative z-10 text-amber-950">
                    <!-- Soft Background Pastel Accents -->
                    ${t.accents ? `
                        <div class="absolute -top-10 -left-10 w-40 h-40 bg-pink-100 rounded-full blur-2xl opacity-70 pointer-events-none"></div>

                    ` : ''}

                    <div class="text-center space-y-2 relative">
                        ${t.accents ? `

                    </div>

                    <div class="my-auto py-3 flex flex-col items-center">
                        <div class="p-3 bg-white rounded-3xl shadow-xl border-4 border-amber-200/60 max-w-xs">
                            ${generatePhotoHTML('rounded-2xl max-h-[260px]')}

                    </div>

                    <div class="grid grid-cols-2 gap-3 bg-amber-50/80 p-4 rounded-2xl border-2 border-dashed border-amber-200">
                        ${t.date ? `

                            WELCOME TO THE WORLD • LITTLE STAR
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 3. Vintage Newspaper Gazette Style
        function renderVintageStyle(d, t) {
            const container = document.getElementById('card-target');
            container.style.backgroundColor = '#fbf7ee';
            
            return `
                <div class="h-full flex flex-col justify-between relative z-10 text-stone-900 border-4 border-double border-stone-800 p-4">
                    <div class="text-center border-b-2 border-stone-900 pb-2">

                    ` : ''}

            `;
        }

        // 4. Luxury Gold & Midnight Noir Style
        function renderLuxuryStyle(d, t) {
            const container = document.getElementById('card-target');
            container.style.backgroundColor = '#0b0b0e';

                        ${t.name ? `<h1 class="text-4xl sm:text-5xl font-serif tracking-wider uppercase gold-metallic-text font-bold">${d.firstName} ${d.lastName}</h1>` : ''}
                        ${t.date ? `<div class="text-xs uppercase tracking-[4px] text-amber-200/80 font-light">${d.date}</div>` : ''}
                    </div>

                    <div class="my-auto py-4 flex flex-col items-center">
                        <div class="p-1 gold-metallic-bg rounded-full shadow-2xl max-w-[200px]">
                            ${generatePhotoHTML('rounded-full shadow-inner')}

                    </div>

                    <div class="space-y-4">
                        <div class="grid grid-cols-3 gap-2 text-center border-t border-b gold-border py-3">

                            ${t.weight ? `<div><span class="block text-[7pt] uppercase tracking-widest text-amber-300/60">WEIGHT</span><span class="text-sm font-bold text-amber-100">${d.weight}</span></div>` : ''}

                            ${t.parents ? `<div class="text-amber-100 font-semibold">PARENTS: ${d.parents}</div>` : ''}

                        </div>
                    </div>

                    ${t.footer ? `
                        <div class="text-center text-[7pt] uppercase tracking-[3px] gold-metallic-text font-mono pt-2 border-t gold-border">
                            LUXURY NOIR EDITION • ARCHIVAL ISSUE

                    ` : ''}
                </div>
            `;
        }

        // 5. Boho Botanical Style
        function renderBohoStyle(d, t) {
            const container = document.getElementById('card-target');
            container.style.backgroundColor = '#f7f2ec';
            
            return `
                <div class="h-full flex flex-col justify-between relative z-10 text-amber-950">
                    <div class="text-center space-y-1">
                        ${t.accents ? `
                            <div class="text-amber-700 text-lg">🌿</div>
                        ` : ''}
                        ${t.name ? `<h1 class="text-4xl sm:text-5xl font-serif italic text-amber-900">${d.firstName} ${d.lastName}</h1>` : ''}
                        ${t.date ? `<div class="text-xs tracking-widest uppercase text-amber-800 font-semibold">${d.date}</div>` : ''}
                    </div>

                    <div class="my-auto py-3 flex flex-col items-center">
                        <div class="w-48 h-64 border-2 border-amber-800/40 p-2 rounded-t-full">
                            ${generatePhotoHTML('w-full h-full rounded-t-full shadow-md')}
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-4 border-t border-b border-amber-800/30 py-3 text-center">
                            ${t.weight ? `<div><span class="block text-[8pt] text-amber-800/60 uppercase font-bold">WEIGHT</span><span class="text-base font-bold">${d.weight}</span></div>` : ''}
                            ${t.height ? `<div><span class="block text-[8pt] text-amber-800/60 uppercase font-bold">LENGTH</span><span class="text-base font-bold">${d.height}</span></div>` : ''}
                        </div>

                        <div class="text-center text-xs text-amber-900/80 space-y-1">
                            ${t.location ? `<div>${d.location}, ${d.city}</div>` : ''}
                            ${t.parents ? `<div>With love: <strong>${d.parents}</strong></div>` : ''}
                            ${t.zodiac ? `<div>Zodiac: ${d.zodiac}</div>` : ''}
                        </div>
                    </div>

                    ${t.footer ? `
                        <div class="text-center text-[8pt] tracking-widest uppercase text-amber-800/50 pt-2 border-t border-amber-800/20">
                            BOHO BOTANICAL COLLECTION
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 6. Cyber Tech Sheet Style
        function renderCyberStyle(d, t) {
            const container = document.getElementById('card-target');
            container.style.backgroundColor = '#050811';
            
            return `
                <div class="h-full flex flex-col justify-between relative z-10 text-cyan-300 font-mono cyber-border p-4">
                    <div class="border-b border-cyan-500/40 pb-2 flex justify-between items-start">
                        <div>
                            <span class="text-[7pt] text-cyan-500 block">[SUBJECT_RECORD]</span>
                            ${t.name ? `<h1 class="text-3xl font-black uppercase text-white cyber-glow-text leading-none">${d.firstName} ${d.lastName}</h1>` : ''}
                        </div>
                        <div class="text-right text-[8pt]">
                            <span class="text-cyan-500 block">TIME_STAMP</span>
                            <span class="text-white font-bold">${d.date}</span>
                        </div>
                    </div>

                    <div class="my-auto py-3 grid grid-cols-12 gap-4 items-center">
                        <div class="col-span-6">
                            ${generatePhotoHTML('border border-cyan-400 shadow-[0_0_15px_rgba(0,255,204,0.3)]')}
                        </div>
                        <div class="col-span-6 space-y-2 text-xs">
                            ${t.time ? `<div><span class="text-cyan-500 text-[8pt] block">TIME:</span><span class="text-white font-bold">${d.time}</span></div>` : ''}
                            ${t.weight ? `<div><span class="text-cyan-500 text-[8pt] block">MASS:</span><span class="text-white font-bold">${d.weight} (${d.weightSub})</span></div>` : ''}
                            ${t.height ? `<div><span class="text-cyan-500 text-[8pt] block">LENGTH:</span><span class="text-white font-bold">${d.height} (${d.heightSub})</span></div>` : ''}
                        </div>
                    </div>

                    <div class="border-t border-cyan-500/40 pt-2 space-y-2 text-xs">
                        <div class="grid grid-cols-2 gap-2">
                            ${t.location ? `<div><span class="text-cyan-500 text-[8pt] block">FACILITY</span><span class="text-white">${d.location}</span></div>` : ''}
                            ${t.coords ? `<div><span class="text-cyan-500 text-[8pt] block">COORDINATES</span><span class="text-white">${d.coords}</span></div>` : ''}
                        </div>
                        ${t.parents ? `<div><span class="text-cyan-500 text-[8pt] block">GENETIC_ORIGIN</span><span class="text-white">${d.parents}</span></div>` : ''}
                    </div>

                    ${t.footer ? `
                        <div class="flex justify-between items-center text-[7pt] text-cyan-600 border-t border-cyan-500/30 pt-1">
                            <span>CYBER_DATA_SYS_v2.6</span>
                            <span>BARCODE // ||||| | |||| |||</span>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 7. Editorial High Fashion Style
        function renderEditorialStyle(d, t) {
            return `
                <div class="h-full flex flex-col justify-between relative z-10 text-black">
                    <div class="border-b-2 border-black pb-2 text-center">
                        <div class="text-[8pt] font-black tracking-[6px] uppercase mb-1">VOGUE VITALIA</div>
                        ${t.name ? `<h1 class="text-4xl sm:text-6xl font-serif font-black uppercase tracking-tight leading-none">${d.firstName}</h1>` : ''}
                        ${t.name ? `<div class="text-2xl sm:text-3xl font-light uppercase tracking-widest text-neutral-700">${d.lastName}</div>` : ''}
                    </div>

                    <div class="my-auto py-2">
                        ${generatePhotoHTML('w-full max-h-[300px] border border-black shadow-xl')}
                    </div>

                    <div class="space-y-3">
                        <div class="grid grid-cols-3 gap-2 border-t-2 border-b-2 border-black py-3 text-center">
                            ${t.date ? `<div><span class="block text-[7pt] text-neutral-400 font-bold uppercase">DATE</span><span class="text-sm font-bold">${d.date}</span></div>` : ''}
                            ${t.weight ? `<div><span class="block text-[7pt] text-neutral-400 font-bold uppercase">WEIGHT</span><span class="text-sm font-bold">${d.weight}</span></div>` : ''}
                            ${t.height ? `<div><span class="block text-[7pt] text-neutral-400 font-bold uppercase">LENGTH</span><span class="text-sm font-bold">${d.height}</span></div>` : ''}
                        </div>

                        <div class="flex justify-between text-xs font-serif">
                            ${t.location ? `<div>${d.location}, ${d.city}</div>` : '<div></div>'}

                        </div>
                    </div>

                    ${t.footer ? `
                        <div class="pt-2 border-t border-neutral-300 flex justify-between text-[7pt] font-mono text-neutral-400 uppercase tracking-widest">

        window.addEventListener('DOMContentLoaded', () => {

            renderCard();
